<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLA - Tu Ecosistema</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d0d; color: #e1e1e1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 450px; padding: 35px; background: #161616; border: 1px solid #2a2a2a; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        h2 { color: #fff; margin-bottom: 25px; font-size: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; background: #222; border: 1px solid #383838; color: #fff; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #ff4d4d; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e03e3e; }
        
        #dashboard-view { display: none; }
        .card { background: #1c1c1c; border: 1px solid #2e2e2e; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
        .btn-logout { background: transparent; color: #777; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- VISTA 1: FORMULARIO -->
    <div id="auth-view">
        <h2>Bienvenido a CampusLA</h2>
        <form id="register-form" action="https://formsubmit.co/eatramites1@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="Nuevo Estudiante en CampusLA">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" id="nombre" required>
            </div>
            <div class="form-group">
                <label>Correo</label>
                <input type="email" name="correo" id="correo" required>
            </div>
            <div class="form-group">
                <label>Institución</label>
                <input type="text" name="institucion" id="institucion" required>
            </div>
            <button type="submit">Ingresar al Ecosistema</button>
        </form>
    </div>

    <!-- VISTA 2: DASHBOARD -->
    <div id="dashboard-view">
        <h2 id="user-greeting">Hola</h2>
        <div class="card">
            <h4>📚 Cursos Moodle</h4>
            <p>Acceso a tus simuladores.</p>
        </div>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
</div>

<script>
    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');
    const form = document.getElementById('register-form');

    // Al cargar, verificamos si ya existe una sesión
    window.onload = () => {
        if (localStorage.getItem('user_data')) {
            mostrarDashboard();
        }
    };

    // Al enviar el formulario
    form.addEventListener('submit', (e) => {
        const nombre = document.getElementById('nombre').value;
        const inst = document.getElementById('institucion').value;
        
        // Guardamos los datos para que el usuario pueda volver
        localStorage.setItem('user_data', JSON.stringify({nombre, inst}));
    });

    function mostrarDashboard() {
        const data = JSON.parse(localStorage.getItem('user_data'));
        authView.style.display = 'none';
        dashboardView.style.display = 'block';
        document.getElementById('user-greeting').innerText = `¡Qué tal, ${data.nombre}!`;
    }

    function cerrarSesion() {
        localStorage.removeItem('user_data');
        location.reload(); // Recarga la página y vuelve al estado inicial
    }
</script>
</body>
</html>
