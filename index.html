<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusLA - Tu Ecosistema</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0b0b; color: #d1d1d1; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 450px; padding: 30px; background: #121212; border: 1px solid #262626; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        h2 { color: #fff; margin-bottom: 10px; font-size: 1.4rem; text-align: center; }
        p.subtitle { font-size: 0.85rem; color: #888; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.8rem; color: #aaa; }
        input { padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 4px; font-size: 0.9rem; }
        input:focus { outline: none; border-color: #ff4d4d; }
        button { width: 100%; padding: 12px; background: #ff4d4d; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        button:hover { background: #e03e3e; }
        #dashboard-view { display: none; }
        .dashboard-header { border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .card { background: #181818; border: 1px solid #2a2a2a; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .card h4 { color: #fff; font-size: 0.95rem; margin-bottom: 5px; }
        .card p { font-size: 0.8rem; color: #999; }
        .badge { display: inline-block; background: #222; color: #ff4d4d; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; margin-top: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- VISTA 1: REGISTRO / ACCESO -->
        <div id="auth-view">
            <h2>CampusLA</h2>
            <p class="subtitle">Tu perfil, recursos y beneficios en un solo lugar.</p>
            <form id="register-form">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Carlos Pérez" required>
                </div>
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="correo" placeholder="tucorreo@dominio.com" required>
                </div>
                <div class="form-group">
                    <label>Institución / Universidad</label>
                    <input type="text" id="institucion" placeholder="Ej. SENA / UNAD" required>
                </div>
                <button type="submit">Crear mi perfil y entrar</button>
            </form>
        </div>

        <!-- VISTA 2: PERFIL DEL ESTUDIANTE -->
        <div id="dashboard-view">
            <div class="dashboard-header">
                <h2 id="user-greeting" style="text-align: left;">Hola</h2>
                <p class="subtitle" id="user-meta" style="text-align: left; margin-bottom: 0;">Estudiante activo</p>
            </div>
            <div class="card">
                <h4>📚 Tus Cursos y Recursos</h4>
                <p>Acceso directo a simuladores y material de inglés.</p>
                <span class="badge">Activo</span>
            </div>
            <div class="card">
                <h4>🎁 Descuentos de Marcas Aliadas</h4>
                <p>Beneficios exclusivos desbloqueados para tu perfil.</p>
                <span class="badge">3 Nuevos</span>
            </div>
            <button onclick="cerrarSesion()" style="background: #222; color: #aaa; border: 1px solid #333;">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('register-form');
        const authView = document.getElementById('auth-view');
        const dashboardView = document.getElementById('dashboard-view');
        const userGreeting = document.getElementById('user-greeting');
        const userMeta = document.getElementById('user-meta');

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const institucion = document.getElementById('institucion').value;

            // Como estamos en GitHub Pages estático sin PHP todavía, simulamos el acceso directo con estilo
            localStorage.setItem('cla_nombre', nombre);
            localStorage.setItem('cla_institucion', institucion);
            mostrarDashboard(nombre, institucion);
        });

        function mostrarDashboard(nombre, institucion) {
            authView.style.display = 'none';
            dashboardView.style.display = 'block';
            userGreeting.innerHTML = `¡Qué tal, ${nombre}!`;
            userMeta.innerHTML = `Institución: ${institucion}`;
        }

        window.onload = function() { 
            if(localStorage.getItem('cla_nombre')) {
                mostrarDashboard(localStorage.getItem('cla_nombre'), localStorage.getItem('cla_institucion'));
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            dashboardView.style.display = 'none';
            authView.style.display = 'block';
            registerForm.reset();
        }
    </script>
</body>
</html>
